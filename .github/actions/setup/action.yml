name: Set up Node and pnpm
description: Install Node from .node-version and pnpm from packageManager, cache the pnpm store and install dependencies.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setup.
    required: false
    default: "true"
  working-directory:
    description: Directory containing package.json and pnpm-lock.yaml.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
        cache: true
        cache_dependency_path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
