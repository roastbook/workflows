name: Set up Bun
description: Install Bun from .bun-version (or package.json packageManager), cache the Bun install cache and install dependencies.

inputs:
  install:
    description: Run `bun install --frozen-lockfile` after setup.
    required: false
    default: "true"
  working-directory:
    description: Directory containing package.json and bun.lock.
    required: false
    default: "."
  bun-version-file:
    description: File with the Bun version, relative to working-directory (.bun-version, or package.json with packageManager "bun@x.y.z").
    required: false
    default: .bun-version

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.working-directory }}/${{ inputs.bun-version-file }}

    - name: Cache Bun packages
      if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Read by bunfig.toml [install.scopes] for GitHub Packages; the calling job needs `packages: read`.
        NPM_GITHUB_TOKEN: ${{ github.token }}
      run: |
        if ! bun install --frozen-lockfile; then
          echo "::error::bun install failed. If a package from GitHub Packages (npm.pkg.github.com, see bunfig.toml) could not be resolved: the calling job needs 'packages: read', the package must exist (published by its release workflow) and be public or grant this repository read access (package settings -> Manage Actions access), and bun.lock must match package.json."
          exit 1
        fi
