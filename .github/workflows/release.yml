name: Release

# Shared release flow (ported from michidk/workflows templates/common/release.yml).
# Run from the caller's workflow_dispatch on the default branch: requires a
# successful push CI run for this exact SHA, computes the next version
# (semver from Conventional Commits via git-cliff, or a YYYY.MM.DD.N date
# version), tags the tested revision as the releaser GitHub App and publishes
# a GitHub Release with git-cliff notes. Optional hooks: release assets, npm
# publishing (GitHub Packages by default) and a repository_dispatch to a
# dependent repository.

on:
  workflow_call:
    inputs:
      bump_type:
        description: auto (from Conventional Commits) or an explicit patch, minor or major. In date mode any explicit value forces a release.
        type: string
        default: auto
      ci_workflow:
        description: Workflow file whose push run must have succeeded for this SHA.
        type: string
        default: ci.yml
      version_scheme:
        description: semver (vX.Y.Z) or date (YYYY.MM.DD.N, UTC).
        type: string
        default: semver
      cliff_config:
        description: git-cliff configuration file.
        type: string
        default: cliff.toml
      git_cliff_version:
        description: git-cliff release to install.
        type: string
        default: v2.14.2
      node_setup:
        description: Run the setup composite action (Bun, bun install) before the assets command.
        type: boolean
        default: false
      assets_command:
        description: Shell command that builds release assets; TAG and VERSION are set. Empty skips assets.
        type: string
        default: ""
      assets_glob:
        description: Files to upload to the release after assets_command (directories are ignored).
        type: string
        default: release/*
      npm_publish:
        description: Publish every npm_package_dirs entry to npm_registry with GITHUB_TOKEN; versions that exist are skipped. The caller job must grant packages write.
        type: boolean
        default: false
      npm_package_dirs:
        description: Whitespace-separated package directories produced by assets_command, published in this order.
        type: string
        default: release/npm
      npm_registry:
        description: npm registry to publish to. GITHUB_TOKEN only authenticates to GitHub Packages.
        type: string
        default: https://npm.pkg.github.com
      node_version:
        description: Node version that provides npm for publishing.
        type: string
        default: "26"
      dispatch_repository:
        description: Repository name in the same owner to notify with repository_dispatch; empty disables it.
        type: string
        default: ""
      dispatch_event:
        description: repository_dispatch event type; client_payload is {version, tag}.
        type: string
        default: released
    secrets:
      RELEASER_APP_ID:
        description: Releaser GitHub App ID (falls back to vars.RELEASER_APP_ID).
        required: false
      RELEASER_APP_PRIVATE_KEY:
        description: Releaser GitHub App private key.
        required: true
    outputs:
      tag:
        description: Released tag; empty when nothing was released.
        value: ${{ jobs.release.outputs.tag }}
      version:
        description: Released version (tag without a leading "v").
        value: ${{ jobs.release.outputs.version }}

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  BUMP_TYPE: ${{ inputs.bump_type }}
  VERSION_SCHEME: ${{ inputs.version_scheme }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Writes go through the releaser App token so tag and release events trigger workflows.
    # packages: read lets the setup action install dependencies from GitHub Packages.
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      tag: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.tag || '' }}
      version: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.version || '' }}
    steps:
      - name: Require default branch and successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '::error::Run Release on the default branch.'
            exit 1
          fi
          runs="$(gh api --method GET "repos/$GH_REPO/actions/workflows/$CI_WORKFLOW/runs" \
            -f head_sha="$GITHUB_SHA" -f branch="$DEFAULT_BRANCH" -f event=push -f per_page=1)"
          if ! jq -e --arg sha "$GITHUB_SHA" --arg repo "$GH_REPO" \
            '.workflow_runs[0] | .head_sha == $sha and .head_repository.full_name == $repo and .conclusion == "success"' <<< "$runs" > /dev/null; then
            echo '::error::The latest push CI run for this revision must succeed before releasing. Rerun Release after CI completes.'
            exit 1
          fi

      - name: Checkout tested source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff and inspect changes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: ${{ inputs.git_cliff_version }}
          config: ${{ inputs.cliff_config }}
          args: --unreleased --output /tmp/unreleased.md

      - name: Calculate version and release notes
        id: version
        env:
          GIT_CLIFF_CONFIG: ${{ inputs.cliff_config }}
        run: |
          set -euo pipefail
          case "$VERSION_SCHEME" in
            semver) stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' ;;
            date) stable='^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$' ;;
            *) echo '::error::Expected version_scheme semver or date.'; exit 1 ;;
          esac
          cliff() { "$RUNNER_TEMP/git-cliff/bin/git-cliff" --tag-pattern "$stable" "$@"; }
          latest="$(git tag --sort=-version:refname | { grep -E "$stable" || true; } | sed -n '1p')"
          if [[ -n "$latest" ]] && ! git merge-base --is-ancestor "$latest" HEAD; then
            echo '::error::The latest release tag must be an ancestor of this revision.'
            exit 1
          fi
          if [[ -n "$latest" && "$(git rev-parse "$latest^{commit}")" == "$GITHUB_SHA" ]]; then
            tag="$latest"
            cliff --current --strip header --output /tmp/release-notes.md
          else
            case "$BUMP_TYPE" in
              auto | patch | minor | major) ;;
              *) echo '::error::Expected auto, patch, minor, or major.'; exit 1 ;;
            esac
            if [[ "$BUMP_TYPE" == auto && -n "$latest" && "$(cliff --unreleased --context | jq '[.[].commits | length] | add // 0')" == 0 ]]; then
              echo 'No unreleased Conventional Commits; nothing to release.'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$VERSION_SCHEME" == date ]]; then
              today="$(date -u +%Y.%m.%d)"
              last="$(git tag --list "$today.*" | { grep -E "$stable" || true; } | sed 's/.*\.//' | sort -n | tail -n 1)"
              tag="$today.$((${last:-0} + 1))"
            elif [[ "$BUMP_TYPE" == auto ]]; then
              tag="$(cliff --bump auto --bumped-version)"
            else
              current="${latest:-v0.0.0}"
              IFS=. read -r major minor patch <<< "${current#v}"
              case "$BUMP_TYPE" in
                patch) ((patch += 1)) ;;
                minor) ((minor += 1)); patch=0 ;;
                major) ((major += 1)); minor=0; patch=0 ;;
              esac
              tag="v$major.$minor.$patch"
            fi
            cliff --unreleased --tag "$tag" --strip header --output /tmp/release-notes.md
          fi
          if [[ ! "$tag" =~ $stable ]]; then
            echo "::error::git-cliff must return a stable $VERSION_SCHEME version, got '$tag'."
            exit 1
          fi
          if [[ -n "$latest" && "$tag" != "$latest" && "$(printf '%s\n' "$latest" "$tag" | sort -V | sed -n '1p')" != "$latest" ]]; then
            echo '::error::The calculated release version goes backwards.'
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo '::error::The calculated tag already points to another revision.'
              exit 1
            fi
            echo 'existing=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.version.outputs.skip != 'true' && inputs.node_setup
        uses: Roastbook/workflows/.github/actions/setup@main

      - name: Build release assets
        if: steps.version.outputs.skip != 'true' && inputs.assets_command != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_COMMAND: ${{ inputs.assets_command }}
        run: bash -euo pipefail -c "$ASSETS_COMMAND"

      - name: Collect the npm packages
        if: steps.version.outputs.skip != 'true' && inputs.npm_publish
        env:
          PACKAGE_DIRS: ${{ inputs.npm_package_dirs }}
        run: |
          set -euo pipefail
          # Numbered copies keep the publish order and survive the artifact's path flattening.
          out="$RUNNER_TEMP/npm-packages"
          i=0
          for dir in $PACKAGE_DIRS; do
            if [[ ! -f "$dir/package.json" ]]; then
              echo "::error::$dir/package.json is missing; assets_command must build every npm_package_dirs entry."
              exit 1
            fi
            mkdir -p "$out/$i"
            cp -R "$dir/." "$out/$i/"
            i=$((i + 1))
          done

      - name: Keep the npm packages for the publish job
        if: steps.version.outputs.skip != 'true' && inputs.npm_publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
          retention-days: 7
          if-no-files-found: error

      - name: Create release App token
        if: steps.version.outputs.skip != 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID || vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Tag the tested revision
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSETS_GLOB: ${{ inputs.assets_command != '' && inputs.assets_glob || '' }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100")"
          state="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft' <<< "$releases")"
          if [[ "$state" == false ]]; then
            echo "Release $TAG is already published; leaving its notes unchanged."
          elif [[ "$state" == true ]]; then
            gh release edit "$TAG" --draft=false --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/release-notes.md
          fi
          assets=()
          if [[ -n "$ASSETS_GLOB" ]]; then
            shopt -s nullglob
            # shellcheck disable=SC2206 # the glob is meant to expand
            for file in $ASSETS_GLOB; do [[ -f "$file" ]] && assets+=("$file"); done
          fi
          if ((${#assets[@]})); then
            gh release upload "$TAG" "${assets[@]}" --clobber
          fi
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish npm packages
    needs: release
    if: inputs.npm_publish && needs.release.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The caller job must grant packages: write as well.
    permissions:
      packages: write
    steps:
      - name: Download the npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry }}
          package-manager-cache: false

      - name: Publish unless the version exists
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ inputs.npm_registry }}
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            spec="$(jq -r '.name + "@" + .version' "$dir/package.json")"
            if npm view "$spec" version --registry "$REGISTRY" > /dev/null 2>&1; then
              echo "$spec is already on $REGISTRY; skipping." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            (cd "$dir" && npm publish --registry "$REGISTRY")
            echo "Published $spec to $REGISTRY." >> "$GITHUB_STEP_SUMMARY"
          done < <(find packages -mindepth 1 -maxdepth 1 -type d | sort -V)

  dispatch:
    name: Notify dependent repository
    needs: release
    if: inputs.dispatch_repository != '' && needs.release.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Create releaser App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID || vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.dispatch_repository }}
          permission-contents: write

      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ github.repository_owner }}/${{ inputs.dispatch_repository }}
          EVENT: ${{ inputs.dispatch_event }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api --method POST "repos/$TARGET/dispatches" -f event_type="$EVENT" \
            -f "client_payload[version]=$VERSION" -f "client_payload[tag]=$TAG"
          echo "Sent \`$EVENT\` ($TAG) to $TARGET." >> "$GITHUB_STEP_SUMMARY"
