name: Pages deploy

# Deploys the github-pages artifact uploaded by site-build.yml in the same run.

on:
  workflow_call:
    outputs:
      page_url:
        description: URL of the deployed site.
        value: ${{ jobs.deploy.outputs.page_url }}

permissions: {}

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
