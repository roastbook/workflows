name: Sync workflows

# Renders the templates for every Roastbook repository with the
# `managed-workflows` topic and opens a pull request per drifted workflow.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: orcastrate-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync managed workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Orcastrate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ORCASTRATE_APP_ID }}
          private-key: ${{ secrets.ORCASTRATE_PRIVATE_KEY }}
          owner: Roastbook
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write

      - name: Install Orcastrate
        env:
          ORCASTRATE_VERSION: v0.2.0
          ORCASTRATE_SHA256: d9bec03678829cb3d692bd05ddd144fc1302380ecde66239e8185b02f1bec6d2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/orcastrate.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/michidk/orcastrate/releases/download/$ORCASTRATE_VERSION/orcastrate-x86_64-unknown-linux-musl.tar.gz"
          echo "$ORCASTRATE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" --strip-components=1 orcastrate-x86_64-unknown-linux-musl/orcastrate
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The release binary, not the Orcastrate action: the action runs the mutable :main image.
      - name: Run Orcastrate
        env:
          ORCASTRATE_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: orcastrate sync --mode pr
