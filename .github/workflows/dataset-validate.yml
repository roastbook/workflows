name: Dataset validate

# Runs scripts/validate.sh of a dataset repository (pinned schema, id
# stability against BASE_REF, source allow-list, image licences), enforces the
# paths the data agent may touch, and runs actionlint.

on:
  workflow_call:
    inputs:
      agent_login:
        description: GitHub App login of the data agent whose pull requests are path-restricted.
        type: string
        default: roastbook-sourcing[bot]
      agent_allowed_paths:
        description: Space-separated bash globs the agent may change (any `*` also matches `/`).
        type: string
        default: datasets/coffee-places/**
      actionlint:
        description: Lint .github/workflows with actionlint.
        type: boolean
        default: true
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 15

permissions: {}

jobs:
  agent-paths:
    name: Agent path rule
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == inputs.agent_login
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject changes outside the allowed paths
        env:
          BASE: origin/${{ github.base_ref }}
          ALLOWED: ${{ inputs.agent_allowed_paths }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
            echo "::error::Base ref $BASE is missing; cannot check the data agent's paths."
            exit 1
          fi
          # Captured first: a failing git diff inside a process substitution would pass the check.
          files="$(git diff --name-only --no-renames "$BASE...HEAD")"
          read -ra globs <<< "$ALLOWED"
          bad=0
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            ok=0
            for glob in "${globs[@]}"; do
              # shellcheck disable=SC2053 # glob match is intended
              [[ "$file" == $glob ]] && ok=1 && break
            done
            if (( ! ok )); then
              echo "::error file=$file::The data agent may only change: $ALLOWED"
              bad=1
            fi
          done <<< "$files"
          exit "$bad"

  validate:
    name: Validate dataset
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # packages: read lets the setup action install dependencies from GitHub Packages.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: Roastbook/workflows/.github/actions/setup@7c716b16de05cc8c9cb80cdd907bf6a87587b1b5 # pinned by scripts/pin-actions.sh

      - name: Run scripts/validate.sh
        env:
          BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: bash scripts/validate.sh

      - name: CI summary
        if: always()
        uses: Roastbook/workflows/.github/actions/summary@7c716b16de05cc8c9cb80cdd907bf6a87587b1b5 # pinned by scripts/pin-actions.sh

  actionlint:
    name: Lint workflows
    if: inputs.actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        # actionlint 1.7.12 does not know the ubuntu-26.04 label yet.
        run: actionlint -ignore 'label "ubuntu-26\.04" is unknown'
