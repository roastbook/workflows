name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ "{{ github.ref }}" }}
  # Every push to main keeps its run: Release requires a successful push run for its commit.
  cancel-in-progress: ${{ "{{ github.event_name == 'pull_request' }}" }}

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
      packages: read
{%- if kind == "schema" %}
    uses: Roastbook/workflows/.github/workflows/schema-validate.yml@{{ <workflows_ref/> }} # main
{%- elif kind == "data" %}
    uses: Roastbook/workflows/.github/workflows/dataset-validate.yml@{{ <workflows_ref/> }} # main
{%- endif %}
